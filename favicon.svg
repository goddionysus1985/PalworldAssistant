<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Градиент фона / сферы -->
    <radialGradient id="sphereGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="45%" stop-color="#0066eb" />
      <stop offset="85%" stop-color="#0a1936" />
      <stop offset="100%" stop-color="#040b17" />
    </radialGradient>

    <!-- Неоновое свечение ядра -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00f2fe" />
      <stop offset="70%" stop-color="#0066eb" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#001845" stop-opacity="0" />
    </radialGradient>

    <!-- Золотой градиент колец -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="50%" stop-color="#ffa751" />
      <stop offset="100%" stop-color="#e67e22" />
    </linearGradient>

    <!-- Фильтр свечения -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Внешняя оболочка сферы -->
  <circle cx="64" cy="64" r="58" fill="url(#sphereGrad)" stroke="url(#goldRing)" stroke-width="4" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.6))"/>

  <!-- Металлические сегменты Pal Sphere -->
  <!-- Верхняя и нижняя дуги -->
  <path d="M 18,50 Q 64,28 110,50" fill="none" stroke="#2a4365" stroke-width="3" opacity="0.6"/>
  <path d="M 18,78 Q 64,100 110,78" fill="none" stroke="#2a4365" stroke-width="3" opacity="0.6"/>

  <!-- Центральный экваториальный золотой пояс -->
  <path d="M 8,64 Q 64,54 120,64" fill="none" stroke="url(#goldRing)" stroke-width="5" filter="url(#glow)"/>
  
  <!-- Центральный светящийся замок сферы -->
  <circle cx="64" cy="64" r="22" fill="#0d1b2a" stroke="url(#goldRing)" stroke-width="3.5"/>
  <circle cx="64" cy="64" r="16" fill="url(#coreGlow)" filter="url(#glow)"/>

  <!-- Внутренний кристалл / лапка энергии Пала -->
  <path d="M 64,54 L 69,63 L 74,64 L 69,69 L 69,74 L 64,70 L 59,74 L 59,69 L 54,64 L 59,63 Z" fill="#ffffff" filter="drop-shadow(0 0 4px #00f2fe)"/>

  <!-- Блики света на стекле сферы -->
  <ellipse cx="44" cy="36" rx="14" ry="7" transform="rotate(-30 44 36)" fill="#ffffff" opacity="0.45"/>
  <circle cx="34" cy="46" r="3" fill="#ffffff" opacity="0.3"/>
</svg>
